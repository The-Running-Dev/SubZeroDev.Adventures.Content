name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build engine and contracts submodules
        run: npm run setup

      - name: Install dependencies
        run: npm ci

      # verification: true
      - name: Check formatting
        run: npm run format:check

      # verification: true
      - name: Lint
        run: npm run lint

      # verification: true
      - name: Typecheck
        run: npm run typecheck

      # verification: true
      - name: Test
        run: npm run test

      # verification: true
      - name: Verify the published content is not stale
        run: |
          npm run export:content
          npm run check:clean

      # verification: true
      - name: Validate published content against the content contract
        run: npm run validate:content

      # verification: true
      - name: Build the Pages artifact
        run: npm run build:site
