name: CI

# Builds the engine and contracts submodules, then runs the format, lint, typecheck and test
# gates and the published-content checks, ending with the Pages artifact build.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/node-ci.yml@v0
    with:
      node-versions: '["24"]'
      submodules: 'true'
      setup: setup
      scripts: format:check lint typecheck test export:content check:clean validate:content build:site
