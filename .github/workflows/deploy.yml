name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build engine and contracts submodules
        run: npm run setup

      - name: Install dependencies
        run: npm ci

      - name: Verify v2/ is not stale
        run: |
          npm run export:content
          git diff --exit-code -- v2

      - name: Validate published content against the content contract
        run: npm run validate:content

      # Pages serves exactly this directory's contents at the repo's Pages root -- v2/'s
      # files land AT that root (no /v2/ path segment), not the whole checkout. Before this
      # workflow, Pages was on the legacy main:/ build, which is how site/'s stray contents
      # ended up accidentally publicly served (README.md's own Status section). A scoped
      # artifact is what fixes that, not a .gitignore or a server-side rule.
      - name: Prepare the Pages artifact (v2/ contents, published at root)
        run: |
          mkdir -p dist
          cp -r v2/. dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
