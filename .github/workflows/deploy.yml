name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build engine and contracts submodules
        run: npm run setup

      - name: Install dependencies
        run: npm ci

      - name: Verify the published content is not stale
        run: |
          npm run export:content
          npm run check:clean

      - name: Validate published content against the content contract
        run: npm run validate:content

      # Pages serves exactly dist/'s contents at the repo's Pages root. build-site.mjs
      # assembles it from the manifest's own file list -- never by copying the repository
      # root, which also holds scripts/, site/, and the submodules. Before this workflow,
      # Pages was on the legacy main:/ build, which is how site/'s stray contents ended up
      # accidentally publicly served (README.md's own Status section); building from an
      # explicit list is what keeps that from regressing.
      - name: Prepare the Pages artifact
        run: npm run build:site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
