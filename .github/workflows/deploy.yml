name: Deploy

# Exports the published content, checks it against the content contract and builds dist/ from
# the manifest's own file list (build-site.mjs), then deploys dist/ to GitHub Pages from main.
# Pull requests only build. Pages serves exactly dist/, never the repository root, which also
# holds scripts/, site/ and the submodules.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/pages.yml@v0
    with:
      node-version: '24'
      submodules: 'true'
      setup: setup
      scripts: export:content check:clean validate:content build:site
